name: badir

# The container reads everything at start — no env is compiled into the image,
# so the same artifact promotes across dev1 / staging1 / prod.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

    env_file:
      - .env

    environment:
      # On the compose network, S3 lives at the minio service, not localhost.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/badir}
      S3_FORCE_PATH_STYLE: "true"

    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: prisma migrate deploy. Exits 0 on success; `app` waits on it via
  # depends_on above. This is what vercel.json used to do inside buildCommand.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-badir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badir}
      POSTGRES_DB: ${DB_NAME:-badir}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - badir_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-badir} -d ${DB_NAME:-badir}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

    ports:
      # Web UI — http://127.0.0.1:8025
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP — point SMTP_* in .env at this
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

    volumes:
      - badir_mailpit:/data

    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local object storage. Deployed environments use Cloudflare R2 — both speak
  # the S3 API, so the app keeps one code path; only the S3_* values in .env
  # change between local and deployed.
  minio:
    image: minio/minio:latest
    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - badir_minio:/data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket bootstrap so a fresh clone has somewhere to upload to.
  # Exits 0 when done — `docker compose ps` showing "exited (0)" is success.
  minio-init:
    image: minio/mc:latest
    restart: "no"

    depends_on:
      minio:
        condition: service_healthy

    # Public read matches how the deployed bucket is served, so local object
    # URLs work in the browser without signing them first.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-minioadmin}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-badir} &&
      mc anonymous set download local/${S3_BUCKET:-badir}
      "

  # Cron scheduler. Replaces vercel.json. Each job is a `job-local` HTTP call
  # against `app` on the compose network, carrying the same `CRON_SECRET`
  # bearer token the routes already validate. Ofelia uses 6-field cron, so a
  # leading seconds field is prepended to every schedule.
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    command: daemon --docker

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    labels:
      ofelia.enabled: "true"
      # ─── daily jobs ──────────────────────────────────────────────────────
      ofelia.job-exec.process-webhooks.schedule: "0 0 8 * * *"
      ofelia.job-exec.process-webhooks.command: >
        curl -fsS -H "Authorization: Bearer $CRON_SECRET"
        http://app:3000/api/cron/process-webhooks
      ofelia.job-exec.process-webhooks.no-overlap: "true"
      ofelia.job-exec.process-post-emails.schedule: "0 0 13 * * *"
      ofelia.job-exec.process-post-emails.command: >
        curl -fsS -H "Authorization: Bearer $CRON_SECRET"
        http://app:3000/api/cron/process-post-emails
      ofelia.job-exec.process-post-emails.no-overlap: "true"
      ofelia.job-exec.close-initiatives.schedule: "0 5 0 * * *"
      ofelia.job-exec.close-initiatives.command: >
        curl -fsS -H "Authorization: Bearer $CRON_SECRET"
        http://app:3000/api/cron/close-initiatives
      ofelia.job-exec.close-initiatives.no-overlap: "true"
      # ─── weekly ───────────────────────────────────────────────────────────
      ofelia.job-exec.inactive-users.schedule: "0 0 9 * * 1"
      ofelia.job-exec.inactive-users.command: >
        curl -fsS -H "Authorization: Bearer $CRON_SECRET"
        http://app:3000/api/cron/inactive-users
      ofelia.job-exec.inactive-users.no-overlap: "true"

    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set in .env}

volumes:
  badir_pgdata:
  badir_mailpit:
  badir_minio:
