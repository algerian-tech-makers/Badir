name: badir

services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db_badir
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums" # Detects data corruption early
    ports:
      - "${DB_PORT:-54332}:5432"
    networks:
      - badir-network

    volumes:
      - postgres_db_badir:/var/lib/postgresql
    # 6. Performance: Optimize internal PostgreSQL configurations
    command: >
      postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS} -c shared_buffers=256MB -c work_mem=16MB -c maintenance_work_mem=64MB -c min_wal_size=1GB -c max_wal_size=4GB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # 8. Resource Constraints: Prevent the container from hogging host resources
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  prisma-migrate:
    image: node:20-alpine
    container_name: prisma_migrate_badir
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm install && rm -rf prisma/migrations/*/ && npx prisma migrate dev --name init && npx prisma db seed"
    networks:
      - badir-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP server restricted to host loopback
      - "127.0.0.1:8025:8025" # Web UI restricted to host loopback
    networks:
      - badir-network
    volumes:
      - mailpit-data:/data
    environment:
      - TZ=UTC
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M
          cpus: "0.10"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio
    container_name: minio-prod-server
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - badir-network
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  minio-init:
    image: minio/mc:latest
    container_name: minio_provisioner
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    networks:
      - badir-network

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-minioadmin}' &&
      mc mb --ignore-existing local/${AVATARS_BUCKET:-avatars} &&
      mc anonymous set download local/${S3_BUCKET:-avatars} &&

      mc mb --ignore-existing local/${DOCUMENTS_BUCKET:-documents} &&
            mc anonymous set download local/${S3_BUCKET:-documents} &&

      mc mb --ignore-existing local/${POST_IMAGES_BUCKET:-post-images} &&
      mc anonymous set download local/${S3_BUCKET:-post-images}
      "

volumes:
  postgres_db_badir:
    name: postgres_db_badir
  mailpit-data:
    name: mailpit-data
    driver: local
  minio_data:
    driver: local
  minio_config:
    driver: local

networks:
  badir-network:
    name: badir-network
    driver: bridge
